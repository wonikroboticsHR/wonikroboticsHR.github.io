<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>원익로보틱스 채용 | Wonik Robotics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;word-break:keep-all;overflow-wrap:break-word}
:root{
  --navy:#0C1A3E;
  --blue:#1A5FBF;
  --blue2:#2E7DD1;
  --blue-lt:#E8F0FC;
  --blue-pill:#D0E3F8;
  --gray:#64748B;
  --gray-lt:#F1F5F9;
  --border:#E2E8F0;
  --white:#FFFFFF;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#F8FAFF;color:#1E293B;font-size:14px;line-height:1.6}

/* HERO */
.hero{background:linear-gradient(135deg,#EEF3FB 0%,#F8FAFF 60%,#E8F0FC 100%);border-bottom:1.5px solid var(--border);position:relative;overflow:hidden;padding:52px 0 0}
.hero-inner{max-width:960px;margin:0 auto;padding:0 48px;display:flex;align-items:flex-end;gap:0}
.hero-text{flex:1;padding-bottom:52px;z-index:2}
.hero-logo{margin-bottom:22px}
.hero-logo img{height:36px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(26,95,191,0.10);border:1px solid rgba(26,95,191,0.25);color:var(--blue);font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:18px;letter-spacing:.05em}
.hero-title{font-size:30px;font-weight:800;color:var(--navy);line-height:1.28;margin-bottom:14px}
.hero-title span{color:var(--blue2)}
.hero-sub{font-size:13px;color:var(--gray);line-height:1.8;max-width:460px;word-break:keep-all}
.hero-tags{display:flex;flex-wrap:nowrap;gap:7px;margin-top:22px;overflow:hidden}
.hero-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(26,95,191,0.08);color:var(--blue);border:1px solid rgba(26,95,191,0.18)}
.hero-img{width:385px;flex-shrink:0;align-self:flex-end;z-index:2;margin-bottom:110px}
.hero-img img{width:100%;display:block}

/* STATS BAR */
.stats-bar{background:var(--white);border-bottom:1px solid var(--border)}
.stats-inner{max-width:960px;margin:0 auto;padding:0 48px;display:grid;grid-template-columns:repeat(4,1fr)}
.stat-item{padding:18px 0;text-align:center;border-right:1px solid var(--border)}
.stat-item:last-child{border-right:none}
.stat-num{font-size:18px;font-weight:800;color:var(--navy)}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px;font-weight:500}

/* LAYOUT */
.page{max-width:960px;margin:0 auto;padding:44px 48px 80px}

/* SECTION */
.sec{margin-top:52px}
.sec-title{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.sec-title .ico{font-size:19px}
.sec-divider{height:1px;background:var(--border);margin:8px 0 24px}

/* ABOUT CARDS */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acard{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden}
.acard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--blue2);border-radius:0}
.acard-icon{font-size:22px;margin-bottom:10px}
.acard-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:7px}
.acard-desc{font-size:13px;color:var(--gray);line-height:1.75}

/* NEWS */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ncard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.ncard-date{font-size:11px;color:var(--gray);font-weight:600;letter-spacing:.03em}
.ncard-title{font-size:13px;font-weight:700;color:var(--navy);line-height:1.5;flex:1}
.ncard-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-lt);color:var(--blue2);width:fit-content}

/* TALENT */
.talent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center}
.tcard-num{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.tcard-title{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:6px}
.tcard-sub{font-size:12px;color:var(--blue2);font-weight:600;margin-bottom:10px}
.tcard-desc{font-size:12px;color:var(--gray);line-height:1.7}

/* CULTURE BOX */
.culture-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:26px 30px}
.culture-inner{display:flex;align-items:flex-start;gap:16px}
.culture-bulb{font-size:22px;flex-shrink:0;margin-top:3px}
.culture-text{font-size:14px;color:#334155;line-height:2.1}
.cbadge{display:inline-block;padding:1px 8px;border-radius:4px;font-weight:700;font-size:13px;margin:0 2px}
.cb1{background:#FEF3C7;color:#92400E}
.cb2{background:#E0F2FE;color:#0369A1}
.cb3{background:#DCFCE7;color:#166534}
.cb4{background:#F3E8FF;color:#7E22CE}
.cb5{background:#FFE4E6;color:#9F1239}

/* BENEFIT */
.benefit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bitem{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px}
.bcheck{width:22px;height:22px;border-radius:6px;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue2);font-size:12px;font-weight:800}
.btext{font-size:13px;color:#334155;font-weight:500;line-height:1.45}

/* FILTER + JOB LIST */
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{font-size:12px;font-weight:700;padding:6px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--white);color:var(--gray);cursor:pointer;transition:all .15s}
.fbtn.active,.fbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.jlist{display:flex;flex-direction:column;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--white)}
.jcard+.jcard{border-top:1px solid var(--border)}
.jhead{padding:15px 20px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:background .12s}
.jhead:hover{background:var(--gray-lt)}
.jicon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--blue-lt)}
.jmeta{flex:1;min-width:0}
.jtitle{font-size:14px;font-weight:700;color:var(--navy)}
.jtags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue-pill);color:var(--blue2)}
.tag.g{background:#D1FAE5;color:#065F46}
.chev{font-size:17px;color:var(--gray);transition:transform .2s;flex-shrink:0}
.jdetail{display:none;padding:0 20px 20px;border-top:1px solid var(--border)}
.jdetail.open{display:block}
.rbox{background:var(--blue-lt);border-radius:10px;padding:11px 16px;margin:13px 0;display:flex;gap:2rem;flex-wrap:wrap}
.ri .rl{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
.ri .rv{font-size:13px;font-weight:700;color:var(--navy);margin-top:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.dc h4{font-size:10px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;border-bottom:1px solid var(--border);padding-bottom:5px}
.dc ul{list-style:none;padding:0}
.dc li{font-size:12px;color:#334155;padding:3px 0 3px 13px;position:relative;line-height:1.55}
.dc li::before{content:"·";position:absolute;left:0;color:var(--blue2);font-weight:700}
.pref{margin-top:13px}

/* PROCESS */
.process-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:14px;overflow:hidden}
.process-row{display:grid;grid-template-columns:repeat(6,1fr)}
.ps{padding:18px 8px;text-align:center;position:relative;border-right:1px solid var(--border)}
.ps:last-child{border-right:none}
.ps::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:#CBD5E1;font-size:13px;z-index:1}
.ps:last-child::after{display:none}
.pn{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.pname{font-size:11px;color:var(--gray);font-weight:600}
.process-note{padding:12px 20px;background:var(--gray-lt);border-top:1px solid var(--border);font-size:11px;color:var(--gray);line-height:1.8}

/* LOCATION */
.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;gap:13px;align-items:flex-start}
.lc-dot{width:9px;height:9px;border-radius:50%;background:var(--blue2);margin-top:5px;flex-shrink:0}
.ln{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.la{font-size:12px;color:var(--gray);line-height:1.65}

/* APPLY BAR */
.apply-bar{background:var(--navy);border-radius:16px;padding:28px 36px;display:flex;align-items:center;justify-content:space-between;margin-top:44px;gap:24px}
.apply-left h3{font-size:17px;font-weight:800;color:#fff;margin-bottom:6px}
.apply-left p{font-size:12px;color:#94A3B8;line-height:1.7}
.apply-left .contact{margin-top:8px;font-size:12px;color:#60A5FA}
.abtn{font-size:14px;font-weight:800;padding:14px 36px;background:var(--blue2);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:background .15s}
.abtn:hover{background:#1A5FBF}

.hidden{display:none!important}
.culture-img-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:32px 36px;overflow:hidden}
</style>
</head>

function createEl(tag, className, htmlValue) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (htmlValue !== undefined) el.innerHTML = htmlValue;
  return el;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function renderStats() {
  const statsRoot = document.getElementById('statsRoot');
  statsRoot.innerHTML = '';
  const stats = SITE_DATA.stats.map((item, index) => {
    if (index === 0) {
      return { ...item, num: String(SITE_DATA.positions.length) };
    }
    return item;
  });
  stats.forEach(item => {
    const wrapper = createEl('div', 'stat-item');
    wrapper.appendChild(createEl('div', 'stat-num', escapeHtml(item.num)));
    wrapper.appendChild(createEl('div', 'stat-lbl', escapeHtml(item.lbl)));
    statsRoot.appendChild(wrapper);
  });
}

  document.getElementById('heroTitle').innerHTML = SITE_DATA.hero.title;
  document.getElementById('heroSub').innerHTML = SITE_DATA.hero.sub;

  const tagsRoot = document.getElementById('heroTags');
  tagsRoot.innerHTML = '';
  SITE_DATA.hero.tags.forEach(tag => {
    tagsRoot.appendChild(createEl('span', 'hero-tag', escapeHtml(tag)));
  });
}

function renderAbout() {
  const root = document.getElementById('aboutGrid');
  root.innerHTML = '';
  SITE_DATA.about.forEach(item => {
    const card = createEl('div', 'acard');
    card.appendChild(createEl('div', 'acard-icon', escapeHtml(item.icon)));
    card.appendChild(createEl('div', 'acard-title', escapeHtml(item.title)));
    card.appendChild(createEl('div', 'acard-desc', escapeHtml(item.desc)));
    root.appendChild(card);
  });
}

function renderNews() {
  const root = document.getElementById('newsGrid');
  root.innerHTML = '';
  SITE_DATA.news.forEach(item => {
    const card = createEl('div', 'ncard');
    card.appendChild(createEl('div', 'ncard-date', escapeHtml(item.date)));
    card.appendChild(createEl('div', 'ncard-badge', escapeHtml(item.badge)));
    card.appendChild(createEl('div', 'ncard-title', escapeHtml(item.title)));
    root.appendChild(card);
  });
}

function renderTalent() {
  const root = document.getElementById('talentGrid');
  root.innerHTML = '';
  SITE_DATA.talent.forEach(item => {
    const card = createEl('div', 'tcard');
    card.appendChild(createEl('div', 'tcard-num', escapeHtml(item.char)));
    card.appendChild(createEl('div', 'tcard-title', escapeHtml(item.title)));
    card.appendChild(createEl('div', 'tcard-sub', escapeHtml(item.sub)));
    card.appendChild(createEl('div', 'tcard-desc', escapeHtml(item.desc)));
    root.appendChild(card);
  });
}

function renderBenefits() {
  const root = document.getElementById('benefitGrid');
  root.innerHTML = '';
  SITE_DATA.benefits.forEach(item => {
    const wrap = createEl('div', 'bitem');
    wrap.appendChild(createEl('div', 'bcheck', '✓'));
    wrap.appendChild(createEl('div', 'btext', escapeHtml(item)));
    root.appendChild(wrap);
  });
}

function renderFilters() {
  const root = document.getElementById('filterRow');
  root.innerHTML = '';
  SITE_DATA.filters.forEach((item, index) => {
    const btn = createEl('button', `fbtn${index === 0 ? ' active' : ''}`);
    btn.dataset.cat = item.cat;
    const count = item.cat === 'all' ? ` ${SITE_DATA.positions.length}` : '';
    btn.textContent = `${item.label}${count}`;
    btn.onclick = () => filterJobs(item.cat, btn);
    root.appendChild(btn);
  });
}

function renderPositions() {
  const root = document.getElementById('jobList');
  root.innerHTML = '';
  SITE_DATA.positions.forEach(position => {
    const card = createEl('div', 'jcard');
    card.dataset.cat = position.cat;

    const head = createEl('div', 'jhead');
    head.onclick = () => toggle(head);
    head.appendChild(createEl('div', 'jicon', escapeHtml(position.icon)));

    const meta = createEl('div', 'jmeta');
    meta.appendChild(createEl('div', 'jtitle', escapeHtml(position.title)));

    const tags = createEl('div', 'jtags');
    position.tags.forEach(tag => tags.appendChild(createEl('span', 'tag', escapeHtml(tag))));
    meta.appendChild(tags);
    head.appendChild(meta);
    head.appendChild(createEl('span', 'chev', '&#8964;'));
    card.appendChild(head);

    const detail = createEl('div', 'jdetail');
    const rbox = createEl('div', 'rbox');
    position.meta.forEach(item => {
      const ri = createEl('div', 'ri');
      ri.appendChild(createEl('div', 'rl', escapeHtml(item.label)));
      ri.appendChild(createEl('div', 'rv', escapeHtml(item.value)));
      rbox.appendChild(ri);
    });
    detail.appendChild(rbox);

    const dgrid = createEl('div', 'dgrid');
    position.sections.forEach(section => {
      const dc = createEl('div', 'dc');
      dc.appendChild(createEl('h4', '', escapeHtml(section.heading)));
      const ul = createEl('ul');
      section.items.forEach(item => ul.appendChild(createEl('li', '', escapeHtml(item))));
      dc.appendChild(ul);
      dgrid.appendChild(dc);
    });
    detail.appendChild(dgrid);
    card.appendChild(detail);
    root.appendChild(card);
  });
}

function renderProcess() {
  const root = document.getElementById('processRow');
  root.innerHTML = '';
  SITE_DATA.process.forEach((item, index) => {
    const step = createEl('div', 'ps');
    step.appendChild(createEl('div', 'pn', String(index + 1)));
    step.appendChild(createEl('div', 'pname', escapeHtml(item)));
    root.appendChild(step);
  });
  document.getElementById('processNote').textContent = SITE_DATA.process_note;
}

function renderLocations() {
  const root = document.getElementById('locationGrid');
  root.innerHTML = '';
  SITE_DATA.locations.forEach(item => {
    const lc = createEl('div', 'lc');
    lc.appendChild(createEl('div', 'lc-dot'));
    const inner = createEl('div');
    inner.appendChild(createEl('div', 'ln', escapeHtml(item.name)));
    inner.appendChild(createEl('div', 'la', item.addr));
    lc.appendChild(inner);
    root.appendChild(lc);
  });
}

function renderApply() {
  document.getElementById('applyTitle').textContent = SITE_DATA.apply.h3;
  document.getElementById('applyDesc').textContent = SITE_DATA.apply.p;
  document.getElementById('applyContact').innerHTML = SITE_DATA.apply.contact;
  document.getElementById('applyButton').href = SITE_DATA.apply.url;
}

function renderCulture() {
  document.getElementById('cultureWay').src = ASSETS.cultureWay;
  document.getElementById('cultureCreed').src = ASSETS.cultureCreed;
}

function toggle(head) {
  const detail = head.nextElementSibling;
  const chev = head.querySelector('.chev');
  const open = detail.classList.contains('open');
  detail.classList.toggle('open', !open);
  chev.style.transform = open ? '' : 'rotate(180deg)';
}

function filterJobs(cat, btn) {
  document.querySelectorAll('.fbtn').forEach(button => button.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.jcard').forEach(card => {
    const cats = card.dataset.cat || '';
    card.classList.toggle('hidden', cat !== 'all' && !cats.split(/\s+/).includes(cat));
  });
}

function renderAll() {
  renderHero();
  renderStats();
  renderAbout();
  renderNews();
  renderTalent();
  renderCulture();
  renderBenefits();
  renderFilters();
  renderPositions();
  renderProcess();
  renderLocations();
  renderApply();
}

document.addEventListener('DOMContentLoaded', renderAll);
</script>
</body>
</html>
